name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    # Ephemeral Postgres for the DB-backed suite (server.test.js).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: catalyst_test
        ports:
          - 5432:5432
        # Wait until Postgres is ready before the job starts.
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      # Point the app/tests at the service container. Plaintext, so disable SSL.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/catalyst_test
      PGSSLMODE: disable
      SESSION_SECRET: ci-test-secret-not-used-in-prod
      NODE_ENV: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run migrations
        run: npm run migrate

      - name: Run tests
        run: node --test *.test.js
