name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    # Ephemeral Postgres for the DB-backed suite (server.test.js).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: catalyst_test
        ports:
          - 5432:5432
        # Wait until Postgres is ready before the job starts.
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      # Point the app/tests at the service container. Plaintext, so disable SSL.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/catalyst_test
      PGSSLMODE: disable
      SESSION_SECRET: ci-test-secret-not-used-in-prod
      NODE_ENV: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run migrations
        run: npm run migrate

      # Our suites are standalone scripts (custom ok() harness), each doing its
      # own process.exit(0/1) — NOT node:test cases. So run them individually and
      # fail the job if ANY suite exits non-zero. (Running them under `node --test`
      # yields false failures/hangs because most files register zero node:test cases
      # and server.test.js boots a live server.)
      - name: Run tests
        run: |
          set +e
          fail=0
          for f in *.test.js; do
            echo "::group::$f"
            node "$f"
            code=$?
            echo "::endgroup::"
            if [ "$code" -ne 0 ]; then
              echo "::error file=$f::$f FAILED (exit $code)"
              fail=1
            fi
          done
          exit $fail
